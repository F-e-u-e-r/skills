name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Repo consistency checks
        run: python3 .github/checks.py
      - name: Derived-checks two-sided tests (each contract gate can pass AND fail)
        run: python3 .github/test-derived-checks.py
      - name: Version-bump policy two-sided unit tests (pure core; push and PR)
        run: python3 .github/test-version-bump.py

  hook-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run every hook test suite (discovered, not hard-coded)
        run: |
          set -euo pipefail
          # Discovery order is the glob's, which is alphabetical - and that put
          # test-mutation_matrix.sh ahead of the two suites its own pristine
          # control runs. On the first Linux run those suites were red inside
          # the matrix's worktree, the harness aborted, `set -e` stopped the
          # job, and their standalone output never appeared. A tool whose
          # control DEPENDS on other suites must not be able to mask them, so
          # the harness runs last while discovery stays automatic.
          found=0
          last=""
          for t in hooks/test-*.sh; do
            case "$t" in *test-mutation_matrix.sh) last="$t"; continue;; esac
            echo "== $t"
            bash "$t"
            found=1
          done
          if [ -n "$last" ]; then
            echo "== $last (runs last: its control depends on the suites above)"
            bash "$last"
            found=1
          fi
          [ "$found" = "1" ] || { echo "no hook test suites discovered"; exit 1; }

  gate-template:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: ground-truth-gates starter template runs green
        run: bash ops-pack/skills/ground-truth-gates/template/run-all.sh

  version-bump:
    # Live history-dependent check: a pack's version must advance when its
    # normative shipped surface changes, evaluated over the PR net delta
    # merge-base(base, head)..head. PR-only: a push to main has no base to
    # compare against, and the pure-core unit tests above already run on push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the real PR head (not the synthetic merge commit) with
          # full history so the merge-base is computable. fetch-depth: 0 is
          # scoped to this dedicated job; other jobs keep their shallow checkout.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require pack version advance for normative changes
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # fetch-depth: 0 above makes origin/<base_ref> available, so the
          # merge-base needs no extra (credentialed) fetch. This job runs
          # PR-controlled code, so persist-credentials stays false and no
          # token is left in .git/config. Inputs arrive via env, never
          # GitHub-expression-interpolated into the shell (injection-safe).
          python3 .github/version_bump_check.py --base "origin/${BASE_REF}" --head "${HEAD_SHA}"
